<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18251e">
  <title>Sign in | Fieldbook</title>
  <link rel="stylesheet" href="/login.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="auth-shell">
    <header class="auth-brand">
      <span class="brand-mark" aria-hidden="true">T2K</span>
      <span><strong>Fieldbook</strong><small>GM access / local network</small></span>
    </header>
    <section class="auth-panel" aria-labelledby="auth-title">
      <div class="panel-kicker"><span class="status-dot" aria-hidden="true"></span><span id="auth-mode-label">LOCAL SIGN-IN</span></div>
      <h1 id="auth-title">Sign in</h1>
      <p class="auth-description" id="auth-description">Enter your username to continue. No password is required on this network.</p>
      <form id="login-form" autocomplete="on">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" type="text" autocomplete="username" minlength="3" maxlength="32" required>
        <button class="submit-button" type="submit">Sign in <span aria-hidden="true">?</span></button>
        <button class="link-button" type="button" id="show-register">Create a new user</button>
      </form>
      <form id="register-form" autocomplete="off" hidden>
        <label for="register-username">New username</label>
        <input id="register-username" name="username" type="text" autocomplete="off" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]+" required>
        <fieldset class="role-field">
          <legend>Account type</legend>
          <label><input type="radio" name="role" value="player" checked> Player</label>
          <label><input type="radio" name="role" value="gm"> Game Master</label>
        </fieldset>
        <button class="submit-button" type="submit">Create user <span aria-hidden="true">?</span></button>
        <button class="link-button" type="button" id="show-login">Back to sign in</button>
      </form>
      <p class="auth-feedback" id="auth-feedback" role="status" aria-live="polite"></p>
      <div class="auth-footer"><span>PRIVATE LAN WORKSPACE</span><span>USERNAME ONLY</span></div>
    </section>
  </main>
</body>
</html>
